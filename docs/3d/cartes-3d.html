<!DOCTYPE html>
<!--
  Noclone : rendu 3D des cartes (three.js)

  Ouvrez ce fichier avec Live Preview : la scène est calculée dans le navigateur,
  puis « Télécharger l'image » enregistre le rendu en PNG.

  Choix de la scène dans l'adresse :
    cartes-3d.html                                  l'éventail des douze cartes (couverture)
    cartes-3d.html?scene=carte&couleur=lagon        une seule carte (couleurs : voir PALETTES)
    cartes-3d.html?scene=mise-en-scene&nom=etui     une mise en scène (noms : voir MISES_EN_SCENE)
  Ajoutez &auto pour ne rien calculer à l'ouverture (rendu piloté par un script).

  Les dimensions sont celles d'une vraie carte bancaire (norme ISO/IEC 7810 ID-1),
  en millimètres : 85,6 × 53,98 × 0,76 mm, coins de 3,18 mm.
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noclone : cartes en 3D</title>
  <style>
    html, body { margin: 0; color: #eef0f4; background: #0f1014; font: 15px/1.4 system-ui, sans-serif; }
    .barre { display: flex; gap: 16px; align-items: center; padding: 12px 16px; }
    .barre a { color: #8fb0ff; }
    img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div class="barre">
    <span id="etat">Rendu en cours…</span>
    <a id="lien" hidden>Télécharger l'image</a>
  </div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const deg = THREE.MathUtils.degToRad;

// ---------------------------------------------------------------------------
// 1. Dimensions et couleurs
// ---------------------------------------------------------------------------

const L = 85.6, H = 53.98, RAYON = 3.18, EPAISSEUR = 0.76, BISEAU = 0.12;

// dégradé de la carte (début, milieu, fin) et couleur de l'impression
const BLANC = 'rgba(255, 255, 255, 0.92)';
const PALETTES = {
  cobalt:   { degrade: ['#3a63f0', '#1630a8', '#2a4fd6'], encre: BLANC },
  orange:   { degrade: ['#ff7a33', '#c94412', '#ef6420'], encre: BLANC },
  emeraude: { degrade: ['#17a06d', '#0a5a3d', '#138a5e'], encre: BLANC },
  lavande:  { degrade: ['#cdbcff', '#8f78e0', '#b8a5ff'], encre: 'rgba(30, 18, 70, 0.85)' },
  corail:   { degrade: ['#ff9378', '#e0553c', '#ff7a5f'], encre: BLANC },
  rose:     { degrade: ['#f7c9cf', '#d98e9a', '#efb3bd'], encre: 'rgba(74, 18, 34, 0.85)' },
  cuivre:   { degrade: ['#f0b18a', '#9c5232', '#d9895f'], encre: BLANC },
  sauge:    { degrade: ['#c4dcc2', '#7f9e83', '#adc9ab'], encre: 'rgba(22, 38, 31, 0.85)' },
  glacier:  { degrade: ['#cbe8ff', '#7fb4e6', '#b2dcff'], encre: 'rgba(11, 27, 51, 0.85)' },
  ambre:    { degrade: ['#ffd27a', '#d48a1c', '#f5b347'], encre: 'rgba(60, 36, 6, 0.85)' },
  cerise:   { degrade: ['#ff4d6d', '#a3112f', '#e0294b'], encre: BLANC },
  lagon:    { degrade: ['#2fd3d9', '#0b7c8f', '#22b3c0'], encre: BLANC },
};
const ORDRE = Object.keys(PALETTES);   // les douze couleurs de la charte

// teintes réservées aux mises en scène
PALETTES.graphite = { degrade: ['#3a3a3d', '#1b1b1d', '#2c2c2f'], encre: 'rgba(255, 255, 255, 0.85)' };
PALETTES.noir     = { degrade: ['#2a2a2d', '#121213', '#232326'], encre: BLANC };
PALETTES.titane   = { degrade: ['#dcdde0', '#8b8d92', '#c3c5c9'], encre: 'rgba(40, 42, 46, 0.85)' };

// ---------------------------------------------------------------------------
// 2. Impression de la face (dessinée sur un canevas, en millimètres)
// ---------------------------------------------------------------------------

const TL = 2048, TH = Math.round(TL * H / L), MM = TL / L;   // pixels par millimètre

function toile(l, h) {
  const c = document.createElement('canvas');
  c.width = l; c.height = h;
  return c;
}

// grain du métal : un bruit très léger
function grain(taille = 512) {
  const c = toile(taille, taille), ctx = c.getContext('2d');
  const img = ctx.createImageData(taille, taille);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

// équivalent de « linear-gradient(140deg, a, b 55%, c) » en CSS
function degrade(ctx, couleurs, l, h, angle = 140) {
  const a = angle * Math.PI / 180, dx = Math.sin(a), dy = -Math.cos(a);
  const longueur = Math.abs(l * dx) + Math.abs(h * dy);
  const g = ctx.createLinearGradient(l / 2 - dx * longueur / 2, h / 2 - dy * longueur / 2,
                                     l / 2 + dx * longueur / 2, h / 2 + dy * longueur / 2);
  g.addColorStop(0, couleurs[0]); g.addColorStop(0.55, couleurs[1]); g.addColorStop(1, couleurs[2]);
  return g;
}

const SANS_CONTACT = new Path2D('M6 6.5a6 6 0 0 1 0 7M9.5 4.5a9 9 0 0 1 0 11M13 2.5a12 12 0 0 1 0 15');

function sansContact(ctx, x, y, taille) {
  ctx.save();
  ctx.translate(x * MM, y * MM); ctx.scale(taille * MM / 20, taille * MM / 20);
  ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.stroke(SANS_CONTACT);
  ctx.restore();
}

// la mise en page de la face, identique au gabarit
function imprimer(ctx, encre, { numero = '•••• 0001', droite = 7 } = {}) {
  ctx.fillStyle = encre; ctx.strokeStyle = encre; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';

  ctx.font = `650 ${4.6 * MM}px Inter`; ctx.letterSpacing = `${-0.04 * 4.6 * MM}px`;
  ctx.fillText('noclone', 7 * MM, 9.6 * MM);
  sansContact(ctx, L - droite - 6, 5.4, 6);

  ctx.font = `400 ${3.7 * MM}px "Space Mono"`; ctx.letterSpacing = `${0.06 * 3.7 * MM}px`;
  ctx.fillText(numero, 7 * MM, (H - 12.5) * MM);

  ctx.font = `500 ${2.05 * MM}px Inter`; ctx.letterSpacing = `${0.16 * 2.05 * MM}px`;
  ctx.fillText('MEMBRE NOCLONE', 7 * MM, (H - 6.6) * MM);

  ctx.font = `400 ${2.7 * MM}px "Space Mono"`; ctx.letterSpacing = '0px'; ctx.textAlign = 'right';
  ctx.fillText('10/30', (L - droite) * MM, (H - 6.6) * MM);
  ctx.textAlign = 'left';
}

// carte verticale : on imprime en portrait (largeur H, hauteur L), puis on tourne l'impression
function imprimerPortrait(ctx, encre) {
  const p = toile(TH, TL), c = p.getContext('2d');
  c.fillStyle = encre; c.strokeStyle = encre; c.textBaseline = 'alphabetic';
  c.font = `650 ${4.4 * MM}px Inter`; c.letterSpacing = `${-0.04 * 4.4 * MM}px`;
  c.fillText('noclone', 6 * MM, 10 * MM);
  sansContact(c, 6, L - 23, 5.5);
  c.font = `400 ${3.6 * MM}px "Space Mono"`; c.letterSpacing = `${0.06 * 3.6 * MM}px`;
  c.fillText('0001', 6 * MM, (L - 11) * MM);
  c.font = `500 ${2 * MM}px Inter`; c.letterSpacing = `${0.16 * 2 * MM}px`;
  c.fillText('MEMBRE', 6 * MM, (L - 6) * MM);
  ctx.save();
  ctx.setTransform(0, 1, -1, 0, TL, 0);   // (x, y) portrait → (L − y, x) paysage
  ctx.drawImage(p, 0, 0);
  ctx.restore();
}

// rosace de sécurité (guilloché)
function rosace(ctx, style, epaisseur) {
  ctx.save();
  ctx.strokeStyle = style; ctx.lineWidth = epaisseur * MM;
  for (let i = 0; i < 36; i++) {
    const a = i * Math.PI / 18;
    ctx.beginPath();
    ctx.ellipse((L * 0.56 + 7 * Math.cos(a)) * MM, (H * 0.5 + 5 * Math.sin(a)) * MM, 25 * MM, 9 * MM, a, 0, 2 * Math.PI);
    ctx.stroke();
  }
  ctx.restore();
}

let GRAIN;

function texturesFace(palette, options = {}) {
  const { motif = null, portrait = false, numero, droite } = options;
  const impression = (ctx, encre) => portrait ? imprimerPortrait(ctx, encre) : imprimer(ctx, encre, { numero, droite });

  // couleur
  const couleur = toile(TL, TH), c = couleur.getContext('2d');
  c.fillStyle = degrade(c, palette.degrade, TL, TH);
  c.fillRect(0, 0, TL, TH);
  c.save();
  c.globalAlpha = 0.09; c.globalCompositeOperation = 'soft-light';
  c.fillStyle = c.createPattern(GRAIN, 'repeat'); c.fillRect(0, 0, TL, TH);
  c.restore();
  if (motif === 'brosse') {                     // métal brossé : de fines rayures dans la longueur
    for (let i = 0; i < 2600; i++) {
      c.fillStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
      c.fillRect(0, Math.random() * TH, TL, 0.5 + Math.random() * 1.5);
    }
  }
  if (motif === 'guilloche') rosace(c, 'rgba(255, 255, 255, 0.3)', 0.22);
  if (motif === 'relief') {
    // chiffres frappés : une ombre, une lumière, puis le chiffre
    imprimer(c, palette.encre, { numero: '' });
    [['rgba(40, 20, 90, 0.45)', 0.22], ['rgba(255, 255, 255, 0.7)', -0.18], ['rgba(255, 255, 255, 0.92)', 0]].forEach(([couleur, d]) => {
      c.save(); c.translate(d * MM, d * MM);
      c.fillStyle = couleur; c.font = `400 ${3.7 * MM}px "Space Mono"`; c.letterSpacing = `${0.06 * 3.7 * MM}px`;
      c.fillText(numero, 7 * MM, (H - 12.5) * MM);
      c.restore();
    });
  } else {
    impression(c, palette.encre);
  }

  // matière : vert = rugosité, bleu = métal. Le métal est satiné, l'encre est mate.
  const matiere = toile(TL, TH), m = matiere.getContext('2d');
  m.fillStyle = 'rgb(0, 88, 100)'; m.fillRect(0, 0, TL, TH);
  if (motif === 'guilloche') rosace(m, 'rgb(0, 50, 230)', 0.22);
  impression(m, motif === 'relief' ? 'rgb(0, 70, 255)' : 'rgb(0, 150, 0)');

  // relief : l'épaisseur de l'encre, ou les chiffres frappés dans le métal
  const relief = toile(TL, TH), r = relief.getContext('2d');
  r.fillStyle = '#000'; r.fillRect(0, 0, TL, TH);
  r.filter = motif === 'relief' ? 'blur(2px)' : 'blur(1.5px)';
  impression(r, '#fff');

  return { couleur, matiere, relief };
}

function texture(canevas, { srgb = false, mm = null } = {}) {
  const t = new THREE.CanvasTexture(canevas);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = 8;
  if (mm) {                       // coordonnées de texture en millimètres (faces extrudées)
    t.repeat.set(1 / mm[0], 1 / mm[1]);
    t.offset.set(0.5, 0.5);
  }
  return t;
}

// ---------------------------------------------------------------------------
// 3. Modèles 3D : carte, puce, carte en verre, bande holographique
// ---------------------------------------------------------------------------

function rectangleArrondi(l, h, r) {
  const s = new THREE.Shape(), x = -l / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + l - r, y);     s.absarc(x + l - r, y + r, r, -Math.PI / 2, 0, false);
  s.lineTo(x + l, y + h - r); s.absarc(x + l - r, y + h - r, r, 0, Math.PI / 2, false);
  s.lineTo(x + r, y + h);     s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(x, y + r);         s.absarc(x + r, y + r, r, Math.PI, 1.5 * Math.PI, false);
  return s;
}

function extrusion(l, h, r, epaisseur, biseau, segments = 16) {
  return new THREE.ExtrudeGeometry(rectangleArrondi(l, h, r), {
    depth: epaisseur - 2 * biseau, bevelEnabled: true,
    bevelThickness: biseau, bevelSize: biseau, bevelOffset: -biseau,
    bevelSegments: 4, curveSegments: segments,
  });
}

const DESSUS = EPAISSEUR - BISEAU;   // hauteur de la face avant dans le repère de la carte
let GEO_CARTE, GEO_PUCE, MAT_PUCE, PUCE_CANEVAS;

function preparerModeles() {
  GEO_CARTE = extrusion(L, H, RAYON, EPAISSEUR, BISEAU);
  GEO_PUCE = extrusion(12, 9, 1.4, 0.08, 0.02, 8);

  const c = toile(480, 360), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 480, 360);
  g.addColorStop(0, '#f6e3a6'); g.addColorStop(0.45, '#c79f45'); g.addColorStop(0.7, '#f1d58c'); g.addColorStop(1, '#c79f45');
  x.fillStyle = g; x.fillRect(0, 0, 480, 360);
  x.strokeStyle = '#8a6624'; x.lineWidth = 7;
  x.stroke(new Path2D('M0 120h156M0 240h156M324 120h156M324 240h156M156 0v360M324 0v360M156 180h168'));
  PUCE_CANEVAS = c;
  MAT_PUCE = new THREE.MeshPhysicalMaterial({
    map: texture(c, { srgb: true, mm: [12, 9] }), metalness: 1, roughness: 0.32,
  });
}

function carteMetal(palette, options) {
  const t = texturesFace(palette, options);
  const matiere = texture(t.matiere, { mm: [L, H] });
  const face = new THREE.MeshPhysicalMaterial({
    map: texture(t.couleur, { srgb: true, mm: [L, H] }),
    roughness: 1, metalness: 1, roughnessMap: matiere, metalnessMap: matiere,
    bumpMap: texture(t.relief, { mm: [L, H] }), bumpScale: options.motif === 'relief' ? 1.6 : 0.6,
    clearcoat: 0.65, clearcoatRoughness: 0.16,
    anisotropy: options.motif === 'brosse' ? 0.7 : 0,
  });
  const tranche = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(palette.degrade[1]), metalness: 0.5, roughness: 0.38, clearcoat: 0.4,
  });
  return new THREE.Mesh(GEO_CARTE, [face, tranche]);
}

function carteVerre() {
  const verre = new THREE.MeshPhysicalMaterial({
    color: 0xffffff, metalness: 0, roughness: 0.3, transmission: 1, thickness: EPAISSEUR,
    ior: 1.5, clearcoat: 1, clearcoatRoughness: 0.06,
  });
  const corps = new THREE.Mesh(GEO_CARTE, verre);
  const impression = toile(TL, TH);
  imprimer(impression.getContext('2d'), 'rgba(255, 255, 255, 0.92)', { numero: '•••• 0000' });
  const plaque = new THREE.Mesh(new THREE.PlaneGeometry(L, H), new THREE.MeshStandardMaterial({
    map: texture(impression, { srgb: true }), transparent: true, roughness: 0.5, metalness: 0, depthWrite: false,
  }));
  plaque.position.z = DESSUS + 0.005;
  corps.add(plaque);
  return corps;
}

function bandeHolographique() {
  const c = toile(64, 1024), x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 1024);
  ['#ffd1e8', '#c8f1ff', '#e6ffd2', '#fff2b8', '#e3d1ff', '#ffd1e8'].forEach((col, i) => g.addColorStop(i / 5, col));
  x.fillStyle = g; x.fillRect(0, 0, 64, 1024);
  const bande = new THREE.Mesh(new THREE.PlaneGeometry(11, H - 0.3), new THREE.MeshPhysicalMaterial({
    map: texture(c, { srgb: true }), metalness: 0.75, roughness: 0.14, clearcoat: 1,
    iridescence: 1, iridescenceIOR: 1.8, iridescenceThicknessRange: [250, 900],
  }));
  bande.position.set(L / 2 - 9 - 5.5, 0, DESSUS + 0.004);
  return bande;
}

// options : numero, motif ('brosse', 'guilloche', 'relief', 'holo'), portrait, droite
function creerCarte(cle, options = {}) {
  const corps = cle === 'verre' ? carteVerre() : carteMetal(PALETTES[cle], options);
  corps.castShadow = cle !== 'verre';
  corps.receiveShadow = true;

  const puce = new THREE.Mesh(GEO_PUCE, MAT_PUCE);
  if (options.portrait) puce.position.set(20.8, -16.5, DESSUS - 0.02);   // en haut à droite, une fois la carte tournée
  else puce.position.set(-L / 2 + 13, H / 2 - 25.5, DESSUS - 0.02);      // dépasse de 0,04 mm
  puce.receiveShadow = true;
  corps.add(puce);
  if (options.motif === 'holo') corps.add(bandeHolographique());

  corps.rotation.x = -Math.PI / 2;              // posée à plat, face vers le haut
  const groupe = new THREE.Group();
  groupe.add(corps);
  groupe.userData = { corps, puce };
  return groupe;
}

// ---------------------------------------------------------------------------
// 4. Décor et caméra
// ---------------------------------------------------------------------------

function degradeRadial(couleurCentre, couleurBord, taille = 512) {
  const c = toile(taille, taille), x = c.getContext('2d');
  const g = x.createRadialGradient(taille / 2, taille / 2, 0, taille / 2, taille / 2, taille / 2);
  g.addColorStop(0, couleurCentre); g.addColorStop(1, couleurBord);
  x.fillStyle = g; x.fillRect(0, 0, taille, taille);
  return c;
}

function planAuSol(l, p, materiau, y) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(l, p), materiau);
  m.rotation.x = -Math.PI / 2;
  m.position.y = y;
  return m;
}

function ombreDeContact(l, p, opacite) {
  return planAuSol(l, p, new THREE.MeshBasicMaterial({
    map: texture(degradeRadial('rgba(0,0,0,1)', 'rgba(0,0,0,0)', 256)), transparent: true, opacity: opacite, depthWrite: false,
  }), 0.02);
}

// fond : 'transparent' (seule l'ombre est dessinée) ou une couleur opaque avec un halo de lumière
function studio(renderer, cible, { fond = 'transparent', soleil: s = [-260, 320, 210], halo = [240, 190], eclat = 0.06 } = {}) {
  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = fond === 'transparent' ? 0.8 : 0.75;

  if (fond === 'transparent') {
    renderer.setClearColor(0x000000, 0);
  } else {
    renderer.setClearColor(new THREE.Color(fond), 1);
    const hex = new THREE.Color(fond).lerp(new THREE.Color(0xffffff), eclat).getHexString();
    const rvb = [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16)).join(', ');
    const voile = planAuSol(halo[0], halo[1], new THREE.MeshBasicMaterial({
      map: texture(degradeRadial(`rgba(${rvb}, 1)`, `rgba(${rvb}, 0)`), { srgb: true }), transparent: true, depthWrite: false, toneMapped: false,
    }), 0.005);
    voile.position.x = cible.x; voile.position.z = cible.z - 10;
    voile.renderOrder = -2;
    scene.add(voile);

    const contre = new THREE.DirectionalLight(0xbfd0ff, 0.7);   // liseré de lumière sur les bords
    contre.position.set(cible.x + 300, 160, cible.z - 400);
    contre.target.position.copy(cible);
    scene.add(contre, contre.target);
  }

  const soleil = new THREE.DirectionalLight(0xffffff, fond === 'transparent' ? 2.3 : 3);
  soleil.position.set(cible.x + s[0], s[1], cible.z + s[2]);
  soleil.target.position.copy(cible);
  soleil.castShadow = true;
  soleil.shadow.mapSize.set(4096, 4096);
  Object.assign(soleil.shadow.camera, { left: -260, right: 260, top: 260, bottom: -260, near: 50, far: 1400 });
  soleil.shadow.bias = -0.0003;
  soleil.shadow.normalBias = 0.2;
  soleil.shadow.radius = fond === 'transparent' ? 9 : 6;
  scene.add(soleil, soleil.target);

  const sol = planAuSol(6000, 6000, new THREE.ShadowMaterial({ opacity: fond === 'transparent' ? 0.5 : 0.55 }), 0.01);
  sol.receiveShadow = true;
  sol.renderOrder = -1;
  scene.add(sol);
  return scene;
}

function camera(cible, { elevation, azimut, distance, champ, ratio, decalage = 0 }) {
  const e = deg(elevation), a = deg(azimut);
  const cam = new THREE.PerspectiveCamera(champ, ratio, 5, 8000);
  cam.position.set(cible.x + distance * Math.cos(e) * Math.sin(a),
                   cible.y + distance * Math.sin(e),
                   cible.z + distance * Math.cos(e) * Math.cos(a));
  cam.lookAt(cible);
  // décale le cadrage verticalement (en fraction de la hauteur de l'image) sans changer la perspective
  if (decalage) cam.setViewOffset(1000 * ratio, 1000, 0, -decalage * 1000, 1000 * ratio, 1000);
  return cam;
}

// ---------------------------------------------------------------------------
// 5. Scènes
// ---------------------------------------------------------------------------

// l'éventail : douze cartes autour d'un pivot, et la carte en verre par-dessus
function sceneEventail(renderer, ratio) {
  const pivot = new THREE.Vector3(0, 0, 60), rayon = 150, pas = 0.8;
  const cible = new THREE.Vector3(0, 0, pivot.z - rayon + 8);
  const scene = studio(renderer, cible, { fond: '#0f1014', halo: [620, 420], eclat: 0.1 });
  ORDRE.forEach((cle, i) => {
    const angle = deg(-27.5 + 5 * i);
    const carte = creerCarte(cle, { numero: `•••• ${String(i + 1).padStart(4, '0')}` });
    carte.position.set(pivot.x + rayon * Math.sin(angle), BISEAU + i * pas, pivot.z - rayon * Math.cos(angle));
    carte.rotation.y = -angle;
    scene.add(carte);
  });
  const verre = creerCarte('verre');
  verre.position.set(10, BISEAU + ORDRE.length * pas + 0.6, pivot.z - rayon + 30);
  verre.rotation.y = deg(-5);
  scene.add(verre);
  const ombre = ombreDeContact(330, 190, 0.45);
  ombre.position.set(cible.x + 12, 0.02, cible.z - 6);
  scene.add(ombre);
  const cadrage = { elevation: 58, azimut: -10, distance: 640, champ: 30, decalage: 0.06, ...(window.CADRAGE || {}) };
  return { scene, cam: camera(cible, { ...cadrage, ratio }) };
}

// une seule carte qui flotte au-dessus du sol (nuancier)
function sceneCarte(renderer, ratio, cle) {
  const cible = new THREE.Vector3(0, 0, 0);
  const scene = studio(renderer, cible, { soleil: [-170, 420, 140] });
  const carte = creerCarte(cle);
  carte.position.y = 7;
  carte.rotation.y = deg(-10);
  scene.add(carte);
  const ombre = ombreDeContact(120, 84, 0.4);
  ombre.position.set(6, 0.02, -5);
  scene.add(ombre);
  return { scene, cam: camera(cible, { elevation: 40, azimut: -16, distance: 205, champ: 24, ratio }) };
}

// les douze mises en scène : une par page du site
const MISES_EN_SCENE = {
  perspective(r, ratio) {
    const cible = new THREE.Vector3(0, 0, 0);
    const scene = studio(r, cible, { fond: '#0d1631' });
    const c = creerCarte('cobalt'); c.position.y = BISEAU; c.rotation.y = deg(-26);
    scene.add(c, ombreDeContact(130, 90, 0.4));
    return { scene, cam: camera(cible, { elevation: 27, azimut: -12, distance: 175, champ: 30, ratio }) };
  },
  'deux-cartes'(r, ratio) {
    const cible = new THREE.Vector3(8, 0, 4);
    const scene = studio(r, cible, { fond: '#161616' });
    const a = creerCarte('graphite'); a.position.set(-6, BISEAU, -4); a.rotation.y = deg(-16);
    const b = creerCarte('orange'); b.position.set(16, BISEAU + 0.9, 10); b.rotation.y = deg(7);
    scene.add(a, b, ombreDeContact(170, 110, 0.4));
    return { scene, cam: camera(cible, { elevation: 46, azimut: -8, distance: 225, champ: 30, ratio }) };
  },
  verticale(r, ratio) {
    const cible = new THREE.Vector3(0, 0, 0);
    const scene = studio(r, cible, { fond: '#0c0f0e' });
    const c = creerCarte('titane', { portrait: true, motif: 'brosse' });
    c.position.y = BISEAU; c.rotation.y = deg(100);
    scene.add(c, ombreDeContact(90, 120, 0.4));
    return { scene, cam: camera(cible, { elevation: 52, azimut: -14, distance: 190, champ: 30, ratio }) };
  },
  relief(r, ratio) {
    const cible = new THREE.Vector3(0, 0, 0);
    const scene = studio(r, cible, { fond: '#221432', soleil: [-300, 160, 120] });
    const c = creerCarte('lavande', { motif: 'relief', numero: '0001 2026 1008 0001' });
    c.position.y = BISEAU; c.rotation.y = deg(-12);
    scene.add(c, ombreDeContact(130, 90, 0.4));
    return { scene, cam: camera(cible, { elevation: 31, azimut: -18, distance: 165, champ: 30, ratio }) };
  },
  givree(r, ratio) {
    const cible = new THREE.Vector3(0, 6, 0);
    const scene = studio(r, cible, { fond: '#120f24' });
    [['#ff6aa2', -20, -6, 15], ['#6a7bff', 22, 4, 17], ['#ffb35c', 2, 14, 12]].forEach(([couleur, x, z, rayon]) => {
      const boule = new THREE.Mesh(new THREE.SphereGeometry(rayon, 48, 32), new THREE.MeshBasicMaterial({ color: couleur, toneMapped: false }));
      boule.position.set(x, rayon * 0.3, z);
      scene.add(boule);
    });
    const c = creerCarte('verre'); c.position.y = 30; c.rotation.y = deg(-6);
    scene.add(c);
    return { scene, cam: camera(cible, { elevation: 58, azimut: -10, distance: 190, champ: 30, ratio }) };
  },
  holographique(r, ratio) {
    const cible = new THREE.Vector3(0, 0, 0);
    const scene = studio(r, cible, { fond: '#0b0b0c' });
    const c = creerCarte('noir', { motif: 'holo', droite: 27 });
    c.position.y = BISEAU; c.rotation.y = deg(-10);
    scene.add(c, ombreDeContact(130, 90, 0.4));
    return { scene, cam: camera(cible, { elevation: 40, azimut: 24, distance: 170, champ: 30, ratio }) };
  },
  epaisseur(r, ratio) {
    const cible = new THREE.Vector3(0, 4, 0);
    const scene = studio(r, cible, { fond: '#0e0d0c' });
    const c = creerCarte('cuivre');
    const inclinaison = deg(16);
    c.rotation.set(inclinaison, deg(-24), 0, 'YXZ');
    c.position.y = (H / 2) * Math.sin(inclinaison) + 0.6;
    scene.add(c, ombreDeContact(130, 90, 0.4));
    return { scene, cam: camera(cible, { elevation: 17, azimut: -34, distance: 160, champ: 30, ratio }) };
  },
  reflet(r, ratio) {
    const cible = new THREE.Vector3(0, H / 2, 0);
    const scene = studio(r, cible, { fond: '#0b1b33' });
    const miroir = new Reflector(new THREE.PlaneGeometry(900, 900), { textureWidth: 2048, textureHeight: 2048, color: 0x9a9a9a });
    miroir.rotation.x = -Math.PI / 2;
    scene.add(miroir);
    const centre = new THREE.Color('#0b1b33');
    const voile = planAuSol(900, 900, new THREE.MeshBasicMaterial({
      color: centre, map: texture(degradeRadial('rgba(255,255,255,0.62)', 'rgba(255,255,255,1)'), { srgb: true }),
      transparent: true, depthWrite: false, toneMapped: false,
    }), 0.05);
    scene.add(voile);
    const c = creerCarte('glacier');
    c.userData.corps.rotation.x = 0;              // debout, face à la caméra
    c.position.y = H / 2 + 0.3; c.rotation.y = deg(-14);
    scene.add(c);
    return { scene, cam: camera(cible, { elevation: 9, azimut: -16, distance: 215, champ: 30, ratio }) };
  },
  etui(r, ratio) {
    const cible = new THREE.Vector3(0, 0, 8);
    const scene = studio(r, cible, { fond: '#0f3a3f' });
    const c = creerCarte('corail'); c.position.y = BISEAU; c.rotation.y = deg(-6);
    // l'étui en feutre : une poche qui couvre le bas de la carte
    const t = toile(1024, 512), x = t.getContext('2d');
    x.fillStyle = '#0b2b2f'; x.fillRect(0, 0, 1024, 512);
    x.globalAlpha = 0.18; x.globalCompositeOperation = 'soft-light';
    x.fillStyle = x.createPattern(GRAIN, 'repeat'); x.fillRect(0, 0, 1024, 512);
    x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
    x.strokeStyle = 'rgba(255, 154, 126, 0.6)'; x.lineWidth = 4; x.setLineDash([18, 12]);
    x.beginPath(); x.roundRect(34, 34, 956, 444, 30); x.stroke();
    x.fillStyle = 'rgba(255, 154, 126, 0.55)'; x.font = '650 64px Inter'; x.letterSpacing = '-2px'; x.textAlign = 'center';
    x.fillText('noclone', 512, 280);
    const feutre = { roughness: 1, sheen: 1, sheenColor: new THREE.Color('#2f6c70'), sheenRoughness: 0.7 };
    const etui = new THREE.Mesh(extrusion(94, 46, 5, 2.4, 0.6), [
      new THREE.MeshPhysicalMaterial({ map: texture(t, { srgb: true, mm: [94, 46] }), ...feutre }),
      new THREE.MeshPhysicalMaterial({ color: '#0b2b2f', ...feutre }),
    ]);
    etui.rotation.x = -Math.PI / 2;
    etui.position.set(0, 1.5, 26);
    etui.castShadow = true; etui.receiveShadow = true;
    const groupeEtui = new THREE.Group(); groupeEtui.add(etui); groupeEtui.rotation.y = deg(-6);
    scene.add(c, groupeEtui, ombreDeContact(150, 110, 0.4));
    return { scene, cam: camera(cible, { elevation: 50, azimut: -12, distance: 200, champ: 30, ratio }) };
  },
  application(r, ratio) {
    const cible = new THREE.Vector3(18, 0, 4);
    const scene = studio(r, cible, { fond: '#0a1a24', halo: [320, 260] });
    scene.add(telephone(), ombreDeContact(200, 220, 0.4));
    const c = creerCarte('lagon'); c.position.set(74, BISEAU, 26); c.rotation.y = deg(24);
    scene.add(c);
    return { scene, cam: camera(cible, { elevation: 56, azimut: -10, distance: 320, champ: 30, ratio }) };
  },
  'gros-plan'(r, ratio) {
    const scene = studio(r, new THREE.Vector3(0, 0, 0), { fond: '#111010' });
    const c = creerCarte('ambre'); c.position.y = BISEAU; c.rotation.y = deg(-18);
    scene.add(c, ombreDeContact(130, 90, 0.4));
    scene.updateMatrixWorld(true);
    const cible = c.userData.puce.getWorldPosition(new THREE.Vector3());
    return { scene, cam: camera(cible, { elevation: 30, azimut: -30, distance: 72, champ: 32, ratio }) };
  },
  guilloche(r, ratio) {
    const cible = new THREE.Vector3(0, 0, 0);
    const scene = studio(r, cible, { fond: '#0f2620' });
    const c = creerCarte('cuivre', { motif: 'guilloche' }); c.position.y = BISEAU; c.rotation.y = deg(-14);
    scene.add(c, ombreDeContact(130, 90, 0.4));
    return { scene, cam: camera(cible, { elevation: 44, azimut: -18, distance: 175, champ: 30, ratio }) };
  },
};

// le téléphone de la mise en scène « Dans l'application »
function telephone() {
  const l = 71.6, h = 147.6, e = 7.8;
  const corps = new THREE.Mesh(extrusion(l, h, 11, e, 1.2, 24), new THREE.MeshPhysicalMaterial({
    color: '#22282d', metalness: 0.85, roughness: 0.32, clearcoat: 0.6,
  }));
  corps.castShadow = true; corps.receiveShadow = true;

  // l'écran : l'application Noclone, dessinée sur un canevas (13,4 px par mm)
  const k = 13.4, ecran = toile(Math.round(l * k), Math.round(h * k)), x = ecran.getContext('2d');
  x.fillStyle = '#000'; x.beginPath(); x.roundRect(0, 0, ecran.width, ecran.height, 10.5 * k); x.fill();
  x.fillStyle = '#0f1418'; x.beginPath(); x.roundRect(2.4 * k, 2.4 * k, (l - 4.8) * k, (h - 4.8) * k, 8.6 * k); x.fill();
  x.fillStyle = '#000'; x.beginPath(); x.roundRect((l / 2 - 12) * k, 6 * k, 24 * k, 7 * k, 3.5 * k); x.fill();
  const face = texturesFace(PALETTES.lagon).couleur;
  const cx = 7 * k, cy = 19 * k, cw = (l - 14) * k, ch = cw * H / L;
  x.save(); x.beginPath(); x.roundRect(cx, cy, cw, ch, 2.4 * k); x.clip();
  x.drawImage(face, cx, cy, cw, ch);
  x.drawImage(PUCE_CANEVAS, cx + cw * 7 / L, cy + ch * 21 / H, cw * 12 / L, ch * 9 / H);
  x.restore();
  x.textBaseline = 'alphabetic';
  x.fillStyle = '#8aa3ab'; x.font = `500 ${2.6 * k}px Inter`; x.letterSpacing = `${0.3 * k}px`;
  x.fillText('SOLDE', 7 * k, 70 * k);
  x.fillStyle = '#ebfbfd'; x.font = `600 ${8 * k}px Inter`; x.letterSpacing = `${-0.25 * k}px`;
  x.fillText('2 450,00 $', 7 * k, 81 * k);
  [['Virement à Alex T.', '23:59 pour annuler'], ['Coffre « Voyage »', 'verrouillé'], ['Ange gardien', 'activé']].forEach(([gauche, droite], i) => {
    const y = (92 + i * 13) * k;
    x.fillStyle = '#1f2a30'; x.fillRect(7 * k, y - 6.5 * k, (l - 14) * k, 0.25 * k);
    x.fillStyle = '#d6e6ea'; x.font = `500 ${3.2 * k}px Inter`; x.letterSpacing = '0px'; x.textAlign = 'left';
    x.fillText(gauche, 7 * k, y);
    x.fillStyle = '#6fe0e6'; x.font = `400 ${2.8 * k}px "Space Mono"`; x.textAlign = 'right';
    x.fillText(droite, (l - 7) * k, y);
    x.textAlign = 'left';
  });
  x.fillStyle = '#d6e6ea'; x.beginPath(); x.roundRect((l / 2 - 15) * k, (h - 6) * k, 30 * k, 1.2 * k, 0.6 * k); x.fill();

  const affichage = new THREE.Mesh(new THREE.PlaneGeometry(l - 0.4, h - 0.4), new THREE.MeshBasicMaterial({
    map: texture(ecran, { srgb: true }), toneMapped: false,
  }));
  affichage.position.z = e - 1.2 + 0.02;
  const vitre = new THREE.Mesh(new THREE.PlaneGeometry(l - 0.6, h - 0.6), new THREE.MeshPhysicalMaterial({
    color: 0xffffff, metalness: 0, roughness: 0.03, transmission: 1, thickness: 0.4, ior: 1.5,
  }));
  vitre.position.z = e - 1.2 + 0.06;
  corps.add(affichage, vitre);
  corps.rotation.x = -Math.PI / 2;
  const groupe = new THREE.Group();
  groupe.add(corps);
  groupe.position.set(-14, 1.2, -6);
  groupe.rotation.y = deg(-14);
  return groupe;
}

// ---------------------------------------------------------------------------
// 6. Rendu
// ---------------------------------------------------------------------------

async function chargerPolices() {
  const polices = [
    new FontFace('Inter', 'url(../fonts/inter-latin-opsz-normal.woff2)', { weight: '100 900' }),
    new FontFace('Space Mono', 'url(../fonts/space-mono-latin-400-normal.woff2)', { weight: '400' }),
  ];
  for (const p of polices) document.fonts.add(await p.load());
}

const pret = chargerPolices().then(() => { GRAIN = grain(); preparerModeles(); });

async function rendre({ scene = 'eventail', couleur = 'cobalt', nom = 'perspective', largeur = 1700, hauteur = 2200 } = {}) {
  await pret;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(largeur, hauteur, false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;

  const ratio = largeur / hauteur;
  const { scene: s, cam } = scene === 'carte' ? sceneCarte(renderer, ratio, couleur)
    : scene === 'mise-en-scene' ? MISES_EN_SCENE[nom](renderer, ratio)
    : sceneEventail(renderer, ratio);
  renderer.render(s, cam);
  const image = renderer.domElement.toDataURL('image/png');
  renderer.dispose();
  return image;
}
window.rendre = rendre;
window.MISES_EN_SCENE = Object.keys(MISES_EN_SCENE);

// affichage dans le navigateur
const parametres = new URLSearchParams(location.search);
if (!parametres.has('auto')) {
  const options = Object.fromEntries(parametres);
  if (options.scene === 'carte') Object.assign(options, { largeur: 1500, hauteur: 1000 });
  if (options.scene === 'mise-en-scene') Object.assign(options, { largeur: 1440, hauteur: 1194 });
  rendre(options).then((image) => {
    const apercu = new Image(), lien = document.getElementById('lien');
    apercu.alt = 'Rendu 3D des cartes Noclone';
    apercu.src = image;
    document.body.append(apercu);
    lien.href = image; lien.download = 'noclone-cartes.png'; lien.hidden = false;
    document.getElementById('etat').textContent = 'Rendu terminé.';
  });
}
